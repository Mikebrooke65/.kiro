name: Supabase Keep-Alive

# Supabase free tier pauses projects after 7 days of inactivity.
# This workflow pings the project on a schedule so it never goes idle.

on:
  schedule:
    # Runs every 3 days at 06:00 UTC — comfortably inside the 7-day pause window
    - cron: '0 6 */3 * *'
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/?select=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
