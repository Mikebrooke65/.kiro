name: Supabase Keep-Alive

# Supabase free tier pauses projects after 7 days of inactivity.
# This workflow pings the project on a schedule so it never goes idle.

on:
  schedule:
    # Runs every 3 days at 06:00 UTC — comfortably inside the 7-day pause window
    - cron: '0 6 */3 * *'
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/teams?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Supabase ping failed with HTTP $HTTP_CODE"
            exit 1
          fi
